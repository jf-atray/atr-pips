[package]
name = "atr-pips"
version = "0.1.0"
edition = "2024"

[dependencies]
atr-plex = { version = "0.2.0", features = ["inherent_associated_types"] }
glam = { version = "0.33.3", features = ["zerocopy"] }
image = { version = "0.25.0", default-features = false, features = ["png"] }
log = "0.4.33"
rand = "0.9"
serde = "1.0.229"
slotmap = "1.1.1"
web-time = "1.1.0"
wgpu = "30.0.0"
winit = "0.30.13"
zerocopy = { version = "0.8.56", features = ["float-nightly"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.10"
pollster = "0.4.0"

[profile.release]
debug = true
